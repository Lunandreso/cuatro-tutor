<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>Cuatro Tutor &mdash; self check</title>
<style>
  body { font: 14px/1.6 "Segoe UI", system-ui, sans-serif; background: #0f1419; color: #e7edf5; padding: 24px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.3rem; }
